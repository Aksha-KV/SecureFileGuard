# fly.toml - Fly.io Linux microVM configuration for SecureFileGuard
app = "securefileguard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "10000"
  ALLOWED_HOSTS = "*.fly.dev,securefileguard.fly.dev"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
